<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Centria Edu | Basics of Web Development</title>

    <style></style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="#" id="page_nav"><b>Contact</b></a></li>
                    <li><a href="#topics">Topics</a></li>
                    <li><a href="#">About</a></li>

                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="topics" id="contact">
            <div class="container">

                <span class="label">Basics of Web Development</span>
                <h1>Contact us</h1>
                <p>
                    Please fill out the form below to get in touch with us.
                    We will respond as soon as possible, Trust me Bro.
                </p>
                <a href="#topics" class="button">
                    Start learning
                </a>
            </div>


            <div class="container_form" id="topics">

                <form class="card" action="https://httpbin.org/post" method="post">
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div>
                        <label for="email">Email address:</label>
                        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com"
                            required>
                    </div>
                    <div>
                        <label for="phone">Phone number:</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div>
                        <label for="subject">Contact subject:</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Select a subject</option>
                            <option value="support">Technical Support</option>
                            <option value="feedback">Feedback</option>
                            <option value="other">Other</option>

                        </select>
                    </div>
                    <div>
                        <label>Preferred contact method:</label>
                        <label>
                            <input type="radio" name="preferred_method" value="email" checked> Email
                        </label>
                        <label>
                            <input type="radio" name="preferred_method" value="phone"> Phone
                        </label>
                    </div>
                    <div>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>
                    <div>
                        <button type="submit" class="button">Submit</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>

</html>
