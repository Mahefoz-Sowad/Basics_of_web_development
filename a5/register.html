<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/register.css">

    <title>Register - Locational Photography by Mahefoz</title>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="index.html"><img src="images/logo.png" alt="Website Logo"></a>
                </div>

                <ul>

                    <li><a href="index.html">Home</a></li>
                    <li><a href="html/about.html">About</a></li>
                    <li><a href="#"><b>Register</b></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="register-section" id="register">
            <div class="container_form" id="registration-form">
                <form class="card" action="https://httpbin.org/post" method="post">
                    <h1>Create an Account</h1>
                    <p class="form-note">
                        Join our community to share your favorite locations, save photo spots, 
                        and connect with fellow photographers.
                    </p>
                    <p class="required-hint"><small>Fields marked with <strong>*</strong> are required.</small></p>

                    <div class="form-group">
                        <label for="name">Name *:</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            autocomplete="name"
                            placeholder="Your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email address *:</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            autocomplete="email" 
                            placeholder="name@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="username">Username * (minimum 3 characters):</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            autocomplete="username"
                            minlength="3" 
                            placeholder="Choose a username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password * (minimum 8 characters):</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            autocomplete="new-password"
                            minlength="8" 
                            placeholder="At least 8 characters"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="user-type">User type *:</label>
                        <select id="user-type" name="user_type" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="hobbyist">Hobbyist Photographer</option>
                            <option value="professional">Professional Photographer</option>
                            <option value="explorer">Location Scout / Explorer</option>
                            <option value="visitor">Photography Enthusiast / Visitor</option>
                        </select>
                    </div>

                    <div class="form-group checkbox-group">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms" 
                            required
                        >
                        <label for="terms">I accept the Terms of Use *</label>
                    </div>

                    <button type="submit" class="button">Register</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
    </footer>

</body>
</html>
